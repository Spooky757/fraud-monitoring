[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-monitoring"
version = "0.1.0"
description = "Drift monitoring and retraining policy for the credit-card fraud model"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "scikit-learn>=1.4.0",
  "xgboost>=2.0.0",
  "joblib>=1.3.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
registry = ["mlflow>=2.10.0"]
dev = ["pytest>=8.0.0", "pyflakes>=3.2.0"]

[project.scripts]
fraud-monitoring = "fraud_monitoring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
