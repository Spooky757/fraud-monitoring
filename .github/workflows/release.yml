# .github/workflows/release.yml — Training repo
#
# Publishes model artifacts (model.pkl, scaler.pkl, threshold.json) as a
# GitHub Release so the monitoring repo can pull them automatically.
#
# Trigger: push to main (only when model files actually change) or manual.
#
# Place this file at:
#   Credit-Card-Fraud-testing/.github/workflows/release.yml

name: Release Model Artifacts

on:
  push:
    branches: [main]
    paths:
      - "models/model.pkl"
      - "models/scaler.pkl"
      - "models/threshold.json"
      - "src/fraud_pipeline/**"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag (e.g. v1.2.0). Leave blank for auto."
        required: false
        default: ""

permissions:
  contents: write          # needed to create releases

jobs:
  # First make sure the pipeline actually produces valid artifacts
  train-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests first
        run: pytest tests/ -v

      # If models/ already has fresh artifacts from a local run that was
      # committed, skip the pipeline. Otherwise train from scratch.
      - name: Train model (if artifacts not committed)
        run: |
          if [[ -f models/model.pkl && -f models/scaler.pkl && -f models/threshold.json ]]; then
            echo "Artifacts already present in models/ — skipping training."
          else
            echo "No committed artifacts — running the training pipeline..."
            python -m src.fraud_pipeline.pipeline
          fi

      - name: Verify artifacts exist
        run: |
          for f in models/model.pkl models/scaler.pkl models/threshold.json; do
            [[ -f "$f" ]] || { echo "Missing: $f"; exit 1; }
          done
          ls -lh models/model.pkl models/scaler.pkl models/threshold.json

      - name: Determine version tag
        id: version
        run: |
          if [[ -n "${{ inputs.version_tag }}" ]]; then
            TAG="${{ inputs.version_tag }}"
          else
            # Auto-generate: v0.1.0-<short-sha>
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="v0.1.0-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version tag: $TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          # Delete existing release with same tag (if re-running)
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # Create the release with the three artifact files
          gh release create "$TAG" \
            models/model.pkl \
            models/scaler.pkl \
            models/threshold.json \
            --title "Model $TAG" \
            --notes "Automated release of fraud detection model artifacts.

          **Files included:**
          - \`model.pkl\` — trained XGBoost classifier
          - \`scaler.pkl\` — fitted StandardScaler for the Amount feature
          - \`threshold.json\` — optimal operating threshold (max F1)

          **Commit:** ${{ github.sha }}

          The monitoring repo (\`fraud-monitoring\`) pulls these automatically via its
          \`monitor.yml\` and \`retrain.yml\` workflows."

      - name: Summary
        run: |
          echo "### Release Created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** \`${{ steps.version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The monitoring repo will automatically pick up these artifacts on its next run." >> "$GITHUB_STEP_SUMMARY"
